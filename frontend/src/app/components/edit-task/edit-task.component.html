<div class="page-content">
  <div class="panel form-panel">
    <div class="panel-header">
      <h3><i class="fa-solid fa-pen-to-square"></i> Edit Task</h3>
      <a routerLink="/tasks" class="btn-outline"><i class="fa-solid fa-arrow-left"></i> Back</a>
    </div>

    <div *ngIf="loading" class="spinner-wrap">
      <div class="spinner"></div>
    </div>

    <form *ngIf="!loading" [formGroup]="form" (ngSubmit)="onSubmit()" class="task-form">
      <div class="form-row">
        <label>Task Name</label>
        <input type="text" formControlName="taskName" placeholder="e.g. Batting Practice" />
        <small class="error" *ngIf="f['taskName'].touched && f['taskName'].invalid">
          Task name is required (min 3 characters).
        </small>
      </div>

      <div class="form-grid">
        <div class="form-row">
          <label>Category</label>
          <select formControlName="category">
            <option value="" disabled>Select category</option>
            <option *ngFor="let c of categoryOptions" [value]="c">{{ c }}</option>
          </select>
          <small class="error" *ngIf="f['category'].touched && f['category'].invalid">Category is required.</small>
        </div>

        <div class="form-row">
          <label>Assigned Group / Unit</label>
          <select formControlName="assignedTo">
            <option value="" disabled>Select player/group</option>
            <option *ngFor="let a of assignedToOptions" [value]="a">{{ a }}</option>
          </select>
          <small class="error" *ngIf="f['assignedTo'].touched && f['assignedTo'].invalid">Assignee is required.</small>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-row">
          <label>Specific Player (Optional)</label>
          <select formControlName="player">
            <option value="">None (Group Assignment)</option>
            <option *ngFor="let p of players" [value]="p._id">
              #{{ p.jerseyNumber }} {{ p.name }} ({{ p.role }})
            </option>
          </select>
        </div>

        <div class="form-row">
          <label>Priority</label>
          <select formControlName="priority">
            <option *ngFor="let p of priorityOptions" [value]="p">{{ p }}</option>
          </select>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-row">
          <label>Practice Date</label>
          <input type="date" formControlName="practiceDate" />
          <small class="error" *ngIf="f['practiceDate'].touched && f['practiceDate'].invalid">Date is required.</small>
        </div>

        <div class="form-row">
          <label>Status</label>
          <select formControlName="status">
            <option *ngFor="let s of statusOptions" [value]="s">{{ s }}</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <label>Tags (Comma separated)</label>
        <input type="text" formControlName="tagsInput" placeholder="e.g. nets, death-overs, match-prep" />
      </div>

      <div class="form-row">
        <label>Description & Objectives</label>
        <textarea formControlName="description" rows="4" placeholder="Optional notes about this task..."></textarea>
      </div>

      <div class="form-actions">
        <a routerLink="/tasks" class="btn-outline">Cancel</a>
        <button type="submit" class="btn-primary" [disabled]="submitting">
          <i class="fa-solid fa-check"></i> {{ submitting ? 'Saving...' : 'Update Task' }}
        </button>
      </div>
    </form>
  </div>
</div>
