<div class="task-card" [class.is-completed]="task.status === 'Completed'">
  <div class="task-card-head">
    <div class="task-icon"><i [class]="icon"></i></div>
    <div class="task-title-wrap">
      <h4>{{ task.taskName }}</h4>
      <span class="pill">{{ task.category }}</span>
    </div>
    <span class="badge" [ngClass]="priorityClass()">{{ task.priority }}</span>
  </div>

  <div class="task-card-body">
    <p *ngIf="task.description" class="task-desc">{{ task.description }}</p>
    <div class="task-meta">
      <span><i class="fa-solid fa-user-group"></i> {{ task.assignedTo }}</span>
      <span><i class="fa-regular fa-calendar"></i> {{ task.practiceDate | date: 'dd-MM-yyyy' }}</span>
    </div>
  </div>

  <div class="task-card-footer">
    <span class="badge" [ngClass]="statusClass()">{{ task.status }}</span>
    <div class="task-actions">
      <button
        *ngIf="task.status !== 'Completed'"
        class="icon-btn success"
        title="Mark Completed"
        (click)="complete.emit(task)"
      >
        <i class="fa-solid fa-check"></i>
      </button>
      <a class="icon-btn" title="Edit" [routerLink]="['/tasks/edit', task._id]">
        <i class="fa-solid fa-pen"></i>
      </a>
      <button class="icon-btn danger" title="Delete" (click)="deleteTask.emit(task)">
        <i class="fa-solid fa-trash"></i>
      </button>
    </div>
  </div>
</div>
