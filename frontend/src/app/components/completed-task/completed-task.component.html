<div class="page-content">
  <div class="panel">
    <div class="panel-header">
      <h3><i class="fa-solid fa-circle-check"></i> Completed Tasks</h3>
    </div>

    <div *ngIf="loading" class="spinner-wrap">
      <div class="spinner"></div>
    </div>

    <div *ngIf="!loading && tasks.length === 0" class="empty-state">
      <i class="fa-solid fa-circle-check"></i>
      <p>No completed tasks yet. Get to work! 🏏</p>
    </div>

    <div class="task-grid" *ngIf="!loading && tasks.length > 0">
      <app-task-card
        *ngFor="let task of tasks"
        [task]="task"
        (complete)="noop()"
        (deleteTask)="confirmDelete($event)"
      ></app-task-card>
    </div>
  </div>
</div>

<div class="modal-backdrop" *ngIf="showDeleteModal" (click)="cancelDelete()">
  <div class="modal-box" (click)="$event.stopPropagation()">
    <i class="fa-solid fa-triangle-exclamation warn-icon"></i>
    <h4>Delete Task?</h4>
    <p>Are you sure you want to delete "<strong>{{ taskToDelete?.taskName }}</strong>"?</p>
    <div class="modal-actions">
      <button class="btn-outline" (click)="cancelDelete()">Cancel</button>
      <button class="btn-danger" (click)="proceedDelete()">Delete</button>
    </div>
  </div>
</div>
